<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ソウル旅行スポットマップ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='38' r='30' fill='%23CD2E3A'/><path d='M50 95 L26 55 h48 z' fill='%23CD2E3A'/><circle cx='50' cy='38' r='13' fill='%23FAF6EF'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root {
  --paper: #FAF6EF;
  --card: #FFFFFF;
  --ink: #22252A;
  --sub: #6D675C;
  --line: #E9E1D2;
  --kr-red: #CD2E3A;
  --kr-blue: #0047A0;
  --c-meal: #D9480F;
  --c-shop: #1864AB;
  --c-cafe: #8D5B34;
  --c-spot: #2B8A3E;
  --c-stay: #212529;
  --disp: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
  --body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--body);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
}

/* ---------- ヘッダー ---------- */
header {
  padding: 14px 16px 0;
  background: var(--paper);
}
.brand { display: flex; align-items: center; gap: 10px; }
.taegeuk {
  width: 26px; height: 26px; border-radius: 50%; flex: none;
  background: linear-gradient(to bottom, var(--kr-red) 50%, var(--kr-blue) 50%);
  position: relative;
}
.taegeuk::before, .taegeuk::after {
  content: ""; position: absolute; width: 13px; height: 13px; border-radius: 50%; top: 6.5px;
}
.taegeuk::before { left: 0; background: var(--kr-red); }
.taegeuk::after { right: 0; background: var(--kr-blue); }
h1 {
  font-family: var(--disp); font-weight: 900; font-size: 20px; letter-spacing: 0.02em;
}
.brand small {
  display: block; font-family: var(--body); font-weight: 400; font-size: 11px;
  color: var(--sub); letter-spacing: 0.06em;
}

/* ---------- エリアタブ ---------- */
nav {
  position: sticky; top: 0; z-index: 1100;
  background: var(--paper);
  padding: 10px 12px;
  display: flex; gap: 6px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.tab {
  font-family: var(--disp); font-weight: 700; font-size: 14px;
  padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink); cursor: pointer; white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.tab:focus-visible { outline: 3px solid var(--kr-blue); outline-offset: 2px; }

/* ---------- レイアウト ---------- */
.wrap { display: flex; flex-direction: column; }
#map {
  height: 52vh; min-height: 300px;
  border-bottom: 1px solid var(--line);
  background: #E8E4DA;
}
.list { padding: 14px 12px 40px; display: flex; flex-direction: column; gap: 10px; }

@media (min-width: 900px) {
  .wrap { flex-direction: row; height: calc(100dvh - 110px); }
  #map { flex: 1.2; height: auto; border-bottom: none; border-right: 1px solid var(--line); }
  .list { flex: 1; overflow-y: auto; max-width: 560px; padding: 16px; }
}

/* ---------- カード ---------- */
.card {
  display: grid; grid-template-columns: 40px 1fr; gap: 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px; cursor: pointer; text-align: left; width: 100%;
  font: inherit; color: inherit;
  transition: border-color .15s, box-shadow .15s;
}
.card:focus-visible { outline: 3px solid var(--kr-blue); outline-offset: 2px; }
.card.active { border-color: var(--ink); box-shadow: 0 2px 10px rgba(34,37,42,.12); }
.disc {
  width: 34px; height: 34px; border-radius: 50%;
  font-family: var(--disp); font-weight: 700; font-size: 16px;
  color: #fff; display: flex; align-items: center; justify-content: center;
  margin-top: 2px;
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.18);
}
.card h2 { font-family: var(--disp); font-weight: 700; font-size: 16px; line-height: 1.4; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 2px; }
.chip {
  font-size: 11px; font-weight: 600; padding: 1.5px 9px; border-radius: 999px;
  border: 1px solid currentColor; background: transparent;
}
.chip.meal-slot { color: #fff; border: none; background: var(--kr-red); }
.hours { font-size: 12.5px; color: var(--sub); margin-top: 2px; }
.memo { font-size: 13px; margin-top: 4px; }
.memo.warn { color: var(--c-meal); font-weight: 600; }
.addr { font-size: 11.5px; color: var(--sub); margin-top: 4px; }
.links { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.maplink {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12.5px; font-weight: 600; text-decoration: none;
  border-radius: 999px; padding: 4px 12px; border: 1.5px solid currentColor;
}
.maplink.gmap { color: var(--kr-blue); }
.maplink.nmap { color: #03A94E; }
.maplink:focus-visible { outline: 3px solid var(--kr-blue); outline-offset: 2px; }

/* ---------- 凡例 ---------- */
.legend {
  display: flex; flex-wrap: wrap; gap: 4px 12px;
  padding: 8px 16px; font-size: 11.5px; color: var(--sub);
}
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* ---------- 地図ピン ---------- */
.pin { background: none; border: none; }
.pin-inner {
  width: 30px; height: 30px; border-radius: 50% 50% 50% 4px;
  transform: rotate(-45deg);
  display: flex; align-items: center; justify-content: center;
  border: 2.5px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.pin-inner b {
  transform: rotate(45deg);
  font-family: var(--disp); font-weight: 700; font-size: 14px; color: #fff;
  font-style: normal;
}
.leaflet-popup-content-wrapper { border-radius: 12px; font-family: var(--body); }
.leaflet-popup-content { margin: 10px 14px; line-height: 1.5; }
.popup-name { font-family: var(--disp); font-weight: 700; font-size: 14px; }
.popup-hours { font-size: 12px; color: var(--sub); }
.popup-link { font-size: 12px; font-weight: 600; color: var(--kr-blue); }

/* ---------- 旅程 ---------- */
[hidden] { display: none !important; }
.itin { max-width: 640px; margin: 0 auto; padding: 16px 14px 48px; }
.itin-note { font-size: 12px; color: var(--sub); margin-bottom: 14px; }
.day {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 16px; margin-bottom: 16px;
}
.day-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.day-chip {
  font-family: var(--disp); font-weight: 900; font-size: 15px; color: #fff;
  border-radius: 999px; padding: 2px 14px;
}
.day-theme { font-family: var(--disp); font-weight: 700; font-size: 14px; color: var(--sub); }
.islot { display: grid; grid-template-columns: 46px 1fr; gap: 10px; padding: 5px 0; }
.islot .when {
  font-family: var(--disp); font-weight: 700; font-size: 12px;
  padding-top: 4px; text-align: right;
}
.islot .body { border-left: 2px solid var(--line); padding-left: 12px; min-height: 30px; }
.islot.plain .body { font-size: 13.5px; padding-top: 3px; }
.islot.muted .body { font-size: 12.5px; color: var(--sub); padding-top: 3px; }
.ispot {
  display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start;
  width: 100%; text-align: left; background: none; border: none; padding: 3px 0;
  font: inherit; color: inherit; cursor: pointer; border-radius: 8px;
}
.ispot:focus-visible { outline: 3px solid var(--kr-blue); outline-offset: 2px; }
.ispot .disc { width: 26px; height: 26px; font-size: 13px; margin-top: 0; }
.ispot .sname { font-family: var(--disp); font-weight: 700; font-size: 14px; line-height: 1.45; }
.ispot .snote { font-size: 12px; color: var(--sub); }
.ispot .snote.warn { color: var(--c-meal); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="taegeuk" aria-hidden="true"></div>
    <h1>ソウル旅行スポットマップ<small>明洞・聖水・COEX&amp;カンナム|全23スポット</small></h1>
  </div>
</header>

<nav role="tablist" aria-label="エリア切り替え" id="tabs"></nav>

<section class="itin" id="itin" hidden>
  <p class="itin-note">時間帯はめやすです。各スポットをタップすると地図に飛びます。</p>
  <div id="itin-days"></div>
</section>

<div class="wrap" id="main">
  <div id="map" role="region" aria-label="地図"></div>
  <div>
    <div class="legend" id="legend"></div>
    <div class="list" id="list"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const SPOTS = __DATA__;

const AREAS = [
  { key: "itin", label: "🧳 旅程" },
  { key: "明洞", label: "明洞" },
  { key: "聖水", label: "聖水" },
  { key: "江南", label: "COEX&カンナム" },
  { key: "all", label: "全体" },
];

const ITINERARY = [
  {
    day: "Day 1",
    theme: "聖水 → 明洞",
    color: "#CD2E3A",
    items: [
      { time: "午前", icon: "✈️", text: "ソウル到着 → ホテルに荷物(会賢駅すぐ)" },
      { time: "午後", icon: "🚇", text: "地下鉄で聖水へ" },
      { spot: "fwee Agit 聖水", note: "プリンポットが看板・購入特典あり" },
      { spot: "Musinsa Store 聖水", note: "スニーカーウォールが圧巻" },
      { spot: "大林倉庫", note: "カフェ休憩(予備: Cafe Onion)" },
      { spot: "EQL SEONGSU GROVE", note: "2Fの週替わりポップアップ" },
      { spot: "Tamburins 聖水", note: "ハンドクリームが土産定番" },
      { time: "夕方", icon: "🚇", text: "明洞へ移動" },
      { spot: "ジェントルモンスター ロッテ百貨店本店", note: "⚠️平日20時閉店・一発目に" },
      { spot: "hetras 明洞店", note: "液体土産を購入→梱包依頼→スーツケースへ" },
      { spot: "nyu nyu 明洞店", note: "hetrasの隣。バラマキ土産" },
      { muted: true, text: "予備: ムシンサ スタンダード / MINISO 明洞(聖水で回りきれなかった分)" },
      { time: "夜", spot: "ユットンリョン 明洞本店", note: "18時台早めに入店。焼肉+〆冷麺" },
      { time: "食後", spot: "ダイソー 明洞駅店", note: "宿から一番近い・22時まで" },
      { spot: "MIMILINE 明洞店", note: "23時まで営業なので最後尾でOK" },
    ],
  },
  {
    day: "Day 2",
    theme: "COEX&カンナム",
    color: "#0047A0",
    items: [
      { time: "朝", spot: "神仙ソルロンタン 明洞店", note: "8時〜。キムチ食べ放題・キッズメニューあり" },
      { time: "午前", icon: "🚇", text: "地下鉄2号線で三成駅(COEX)へ" },
      { muted: true, text: "ここから二手に分かれてもOK(水族館チーム/買い物チーム)" },
      { spot: "SEA LIFE COEX", note: "水中トンネルとマーメイドショー。所要2時間" },
      { time: "昼", spot: "スターフィールドCOEXモール", note: "買い物チームの主戦場。昼はフードコートで" },
      { time: "午後", spot: "別マダン図書館", note: "合流してみんなで。COEX内B1の映えスポット" },
      { time: "夕方", spot: "MINISO 江南店", note: "液体土産はこの日までに購入" },
      { time: "夜", icon: "🧳", text: "ホテルで液体土産をスーツケースへ" },
    ],
  },
  {
    day: "Day 3",
    theme: "明洞 → 帰国",
    color: "#2B8A3E",
    items: [
      { time: "朝", spot: "本粥&ビビンバ 会賢駅店", note: "宿の目の前・徒歩1分" },
      { time: "午前", spot: "オリーブヤング 明洞タウン店", note: "最終日は機内持ち込み可の物だけ" },
      { time: "昼", spot: "孝潭カルグクス・タッカンマリ 明洞本店", note: "混む前の12時台前半に入店" },
      { time: "午後", icon: "✈️", text: "帰国へ" },
    ],
  },
];

const CAT = {
  "宿":     { color: "var(--c-stay)", hex: "#212529" },
  "買い物": { color: "var(--c-shop)", hex: "#1864AB" },
  "食事":   { color: "var(--c-meal)", hex: "#D9480F" },
  "カフェ": { color: "var(--c-cafe)", hex: "#8D5B34" },
  "スポット": { color: "var(--c-spot)", hex: "#2B8A3E" },
};

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const map = L.map("map", { zoomControl: true });
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
  maxZoom: 20,
}).addTo(map);

let markers = {};
let currentArea = "itin";

function spotByName(name) {
  return SPOTS.find(s => s.name === name);
}

function jumpToSpot(name) {
  const s = spotByName(name);
  if (!s) return;
  currentArea = s.area;
  renderArea();
  window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  requestAnimationFrame(() => focusSpot(s));
}

function renderItinerary() {
  const root = document.getElementById("itin-days");
  root.innerHTML = "";
  for (const d of ITINERARY) {
    const card = document.createElement("section");
    card.className = "day";
    let html = `<div class="day-head"><span class="day-chip" style="background:${d.color}">${d.day}</span><span class="day-theme">${d.theme}</span></div>`;
    for (const it of d.items) {
      const when = it.time ? it.time : "";
      if (it.spot) {
        const s = spotByName(it.spot);
        const warn = (it.note || "").startsWith("⚠️");
        const inner = s
          ? `<button class="ispot" onclick="jumpToSpot('${s.name.replace(/'/g, "\\'")}')">
               <span class="disc" style="background:${CAT[s.category].hex}">${s.no}</span>
               <span><span class="sname">${s.name}</span><br><span class="snote${warn ? " warn" : ""}">${it.note || ""}</span></span>
             </button>`
          : `<div class="ispot"><span>${it.spot}</span></div>`;
        html += `<div class="islot"><span class="when">${when}</span><div class="body">${inner}</div></div>`;
      } else {
        const cls = it.muted ? "islot muted" : "islot plain";
        html += `<div class="${cls}"><span class="when">${when}</span><div class="body">${it.icon ? it.icon + " " : ""}${it.text}</div></div>`;
      }
    }
    card.innerHTML = html;
    root.appendChild(card);
  }
}

function gmapUrl(s) {
  return `https://www.google.com/maps/search/?api=1&query=${s.lat}%2C${s.lng}`;
}

function naverUrl(s) {
  return `https://map.naver.com/p/search/${s.lat},${s.lng}`;
}

const APPNAME = encodeURIComponent("https://shuheilocale.github.io/seoul-trip-map/");

function openNaver(event, id) {
  const s = SPOTS.find(x => x.id === id);
  const ua = navigator.userAgent;
  const name = encodeURIComponent(s.name);

  if (/Android/i.test(ua)) {
    event.preventDefault();
    event.stopPropagation();
    location.href =
      `intent://place?lat=${s.lat}&lng=${s.lng}&name=${name}&appname=${APPNAME}` +
      `#Intent;scheme=nmap;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.nmap;end`;
    return;
  }
  if (/iPhone|iPad|iPod/i.test(ua)) {
    event.preventDefault();
    event.stopPropagation();
    // アプリが開けば画面が隠れてタイマーは破棄される。開けなければWeb版へ
    const fallback = setTimeout(() => { location.href = naverUrl(s); }, 1600);
    const cancel = () => { if (document.hidden) { clearTimeout(fallback); document.removeEventListener("visibilitychange", cancel); } };
    document.addEventListener("visibilitychange", cancel);
    location.href = `nmap://place?lat=${s.lat}&lng=${s.lng}&name=${name}&appname=${APPNAME}`;
    return;
  }
  // PCブラウザは href(Web版)をそのまま開く
  event.stopPropagation();
}

function pinIcon(s) {
  return L.divIcon({
    className: "pin",
    html: `<div class="pin-inner" style="background:${CAT[s.category].hex}"><b>${s.no}</b></div>`,
    iconSize: [30, 30],
    iconAnchor: [4, 28],
    popupAnchor: [11, -28],
  });
}

function spotsFor(area) {
  return area === "all" ? SPOTS : SPOTS.filter(s => s.area === area);
}

function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  for (const a of AREAS) {
    const b = document.createElement("button");
    b.className = "tab";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(a.key === currentArea));
    b.textContent = a.label;
    b.addEventListener("click", () => { currentArea = a.key; renderArea(); });
    nav.appendChild(b);
  }
}

function renderLegend() {
  const el = document.getElementById("legend");
  el.innerHTML = Object.entries(CAT)
    .map(([name, c]) => `<span><i class="dot" style="background:${c.hex}"></i>${name}</span>`)
    .join("");
}

function cardHtml(s) {
  const meal = s.mealSlot ? `<span class="chip meal-slot">${s.mealSlot}</span>` : "";
  const warn = s.memo.startsWith("⚠️");
  const memo = s.memo ? `<p class="memo${warn ? " warn" : ""}">${s.memo}</p>` : "";
  const hours = s.hours ? `<p class="hours">🕐 ${s.hours}</p>` : "";
  return `
    <span class="disc" style="background:${CAT[s.category].hex}">${s.no}</span>
    <span>
      <h2>${s.name}</h2>
      <span class="chips">
        <span class="chip" style="color:${CAT[s.category].hex}">${s.category}</span>${meal}
      </span>
      ${hours}${memo}
      <p class="addr">${s.address}</p>
      <span class="links">
        <a class="maplink gmap" href="${gmapUrl(s)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Googleマップ ↗</a>
        <a class="maplink nmap" href="${naverUrl(s)}" target="_blank" rel="noopener" onclick="openNaver(event, ${s.id})">NAVERマップ ↗</a>
      </span>
    </span>`;
}

function focusSpot(s, { fromMap = false } = {}) {
  document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
  const card = document.getElementById(`card-${s.id}`);
  if (card) {
    card.classList.add("active");
    if (fromMap) card.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
  }
  const m = markers[s.id];
  if (m) {
    if (!fromMap) {
      if (reduceMotion) map.setView([s.lat, s.lng], Math.max(map.getZoom(), 16));
      else map.flyTo([s.lat, s.lng], Math.max(map.getZoom(), 16), { duration: 0.6 });
    }
    m.openPopup();
  }
}

function renderArea() {
  renderTabs();

  const isItin = currentArea === "itin";
  document.getElementById("itin").hidden = !isItin;
  document.getElementById("main").hidden = isItin;
  if (isItin) return;
  map.invalidateSize();

  const spots = spotsFor(currentArea);

  Object.values(markers).forEach(m => m.remove());
  markers = {};

  const list = document.getElementById("list");
  list.innerHTML = "";

  for (const s of spots) {
    const m = L.marker([s.lat, s.lng], { icon: pinIcon(s), alt: `${s.no} ${s.name}` }).addTo(map);
    m.bindPopup(
      `<div class="popup-name">${s.no}. ${s.name}</div>` +
      (s.hours ? `<div class="popup-hours">🕐 ${s.hours}</div>` : "") +
      `<a class="popup-link" href="${gmapUrl(s)}" target="_blank" rel="noopener">Googleマップ ↗</a>` +
      `&nbsp;&nbsp;<a class="popup-link" style="color:#03A94E" href="${naverUrl(s)}" target="_blank" rel="noopener" onclick="openNaver(event, ${s.id})">NAVERマップ ↗</a>`
    );
    m.on("click", () => focusSpot(s, { fromMap: true }));
    markers[s.id] = m;

    const card = document.createElement("button");
    card.className = "card";
    card.id = `card-${s.id}`;
    card.innerHTML = cardHtml(s);
    card.addEventListener("click", () => focusSpot(s));
    list.appendChild(card);
  }

  const bounds = L.latLngBounds(spots.map(s => [s.lat, s.lng]));
  map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16, animate: false });
}

renderLegend();
renderItinerary();
renderArea();
</script>
</body>
</html>
